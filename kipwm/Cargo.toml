[package]
name = "kipwm"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
libc = "0.2.186"
rhai = "1.24.0"
x11-keysyms = { version = "0.1.0", features = ["latin1", "miscellany"] }
x11rb = { version = "0.13.2", features = ["xkb"] }

[[bin]]
name = "kipwm"
path = "src/main.rs"

[[bin]]
name = "kipc"
path = "src/bin/client.rs"
